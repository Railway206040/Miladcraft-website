name: Test and validate

on:
  push:
    branches: ["main", "cloudflare-migration-access-check"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py cloudflare_db.py worker.py templates_bundle.py tests
      - name: Run application tests
        run: python -m unittest discover -s tests -v

  cloudflare-python-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python Worker dependencies
        run: uv sync --group dev
      - name: Validate Cloudflare Python Worker bundle
        run: uv run pywrangler deploy --dry-run
