{% extends "base.html" %}
{% block title %}ورود به حساب | MILAD CRAFT{% endblock %}
{% block content %}
<section class="auth-wrap"><a class="back-link" href="{{ url_for('account_portal') }}">← بازگشت به حساب‌ها</a><div class="auth-card"><div class="auth-brand"><img src="{{ site_images.get('site_logo') or url_for('static',filename='logo.svg') }}" alt=""><span class="eyebrow">WELCOME BACK / MILAD CRAFT</span></div><h1>خوش برگشتی.</h1><p class="auth-subtitle">با همان حساب بازیکن یا کارکنان وارد شو.</p><form method="post" class="form-stack">{{ csrf_field() }}<label>نام کاربری<input name="username" autocomplete="username" required minlength="3" maxlength="30" value="{{ request.form.get('username','') }}" placeholder="نام کاربری"></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required placeholder="رمز عبور"></label><button class="button button-primary button-full button-large" type="submit">ورود به حساب <span class="button-arrow">←</span></button></form><div class="auth-bottom">حساب نداری؟ <a href="{{ url_for('account_register') }}">یک حساب بساز</a></div></div></section>
{% endblock %}
