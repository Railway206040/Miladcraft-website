{% extends "base.html" %}
{% block title %}ساخت حساب | MILAD CRAFT{% endblock %}
{% block content %}
<section class="auth-wrap"><a class="back-link" href="{{ url_for('account_portal') }}">← بازگشت به حساب‌ها</a><div class="auth-card auth-card-wide"><div class="auth-brand"><img src="{{ site_images.get('site_logo') or url_for('static',filename='logo.svg') }}" alt=""><span class="eyebrow">JOIN THE WORLD</span></div><h1>حساب خودت را بساز.</h1><p class="auth-subtitle">بعداً می‌توانی پروفایل و اطلاعاتت را تکمیل کنی.</p><form method="post" class="form-stack">{{ csrf_field() }}<div class="form-grid"><label>نام کاربری<input name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" value="{{ request.form.get('username','') }}"><small>۳ تا ۳۰ نویسه؛ حروف انگلیسی، عدد و زیرخط.</small></label><label>نام نمایشی<input name="display_name" maxlength="80" value="{{ request.form.get('display_name','') }}" placeholder="نامی که دیگران می‌بینند"></label><label>نام کاربری Minecraft <span class="optional-label">اختیاری</span><input name="minecraft_username" maxlength="32" value="{{ request.form.get('minecraft_username','') }}"></label><label>رمز عبور<input name="password" type="password" autocomplete="new-password" required minlength="10"><small>حداقل ۱۰ نویسه.</small></label><label>تکرار رمز عبور<input name="confirm_password" type="password" autocomplete="new-password" required minlength="10"></label></div><button class="button button-primary button-full button-large" type="submit">ساخت حساب <span>←</span></button></form><div class="auth-bottom">قبلاً ثبت‌نام کرده‌ای؟ <a href="{{ url_for('account_login') }}">وارد شو</a></div></div></section>
{% endblock %}
