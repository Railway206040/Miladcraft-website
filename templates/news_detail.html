<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{ item['summary'] or item['title'] }} | اخبار MILAD CRAFT"><meta property="og:title" content="{{ item['title'] }} | MILAD CRAFT"><meta property="og:description" content="{{ item['summary'] }}"><title>{{ item['title'] }} | اخبار MILAD CRAFT</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="{{ site_images.get('site_logo') or url_for('static',filename='logo.svg') }}" alt=""><span class="brand-text">MILAD<span>CRAFT</span></span></a><a class="button button-outline" href="{{ url_for('news_page') }}">همه اخبار</a></header><main class="article-reader"><a class="breadcrumb-link" href="{{ url_for('news_page') }}">اخبار <span>←</span></a>{% if item['cover_url'] %}<img class="reader-cover" src="{{ item['cover_url'] }}" alt="">{% endif %}<p class="eyebrow">MILAD CRAFT NEWS</p><h1>{{ item['title'] }}</h1><p class="reader-summary">{{ item['summary'] }}</p><div class="reader-meta">نویسنده: {{ item['author'] }} · {{ item['created_at'][:10] }}</div><article class="rich-content">{{ item['content']|safe }}</article></main></body></html>
